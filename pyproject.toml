[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "text_diff"
dynamic = ["version"]
description = "Turn an LLM rewrite into reviewable, sentence-sized change blocks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hugo Bellamy", email = "hugo.bellamy8@gmail.com"}]
keywords = ['diff', 'llm', 'writing']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/hugobellamy/text_diff"

[tool.setuptools.dynamic]
version = {attr = "text_diff.__version__"}

[tool.setuptools.packages.find]
include = ["text_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
